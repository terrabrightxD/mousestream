name: WDK driver build (configured runner required)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver:
    # Deliberately opt-in: hosted SDK CI does not claim to validate kernel code.
    # Configure a private/trusted Windows x64 runner with VS + matching SDK/WDK.
    runs-on: [self-hosted, Windows, X64, wdk]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild driver/MouseStream.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-driver-UNSIGNED
          path: build/driver/x64/Release/MouseStream.sys
          if-no-files-found: error
